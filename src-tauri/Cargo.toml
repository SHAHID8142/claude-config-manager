[package]
name = "claude-config-manager"
version = "1.0.0"
description = "Desktop manager for Claude Code CLI global configuration"
authors = ["SHAHID8142"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_config_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2.5.8"
# G10: `platform-verifier` makes trust follow the macOS system store (including
# MDM/corporate roots) instead of only the bundled webpki roots.
ureq = { version = "3", features = ["rustls", "platform-verifier"] }
getrandom = "0.3"
sha2 = "0.11.1"
base64 = "0.23.1"
tar = "0.4.46"
flate2 = "1.1.11"

[dev-dependencies]
# G3: property-based tests for the merge contract (no test cases hand-written).
proptest = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
